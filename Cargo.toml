[package]
name = "wireguard-gui-rust"
version = "1.6.0"
edition = "2021"
rust-version = "1.75"
description = "WireGuard client for Linux, written in Rust"
license = "GPL-3.0-or-later"

[[bin]]
name = "wgr"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ksni = "0.2"
dirs = "5"
libc = "0.2"

[profile.release]
opt-level = 2
lto = true
strip = true
